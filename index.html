<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа 3 - Адаптивная верстка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="header">
        <div class="logo">Лого</div>
        <div class="site-title">Название сайта</div>
    </header>

    <!-- Навигация -->
    <nav class="nav">
        <ul>
            <li><a href="#">Ссылка меню 1</a></li>
            <li><a href="#">Ссылка меню 2</a></li>
            <li><a href="#">Ссылка меню 3</a></li>
        </ul>
    </nav>

    <!-- Основной контент (обертка для управления порядком через flex order) -->
    <main class="main-content">
        <!-- Таблица (потребуется поставить выше списка на моб. устройствах через order) -->
        <section class="table-section">
            <h2>Таблица с данными</h2>
            <table class="content-table">
                <tr>
                    <th>Параметр</th>
                    <th>Значение</th>
                </tr>
                <tr>
                    <td>Пример 1</td>
                    <td>Данные 1</td>
                </tr>
                <tr>
                    <td>Пример 2</td>
                    <td>Данные 2</td>
                </tr>
            </table>
        </section>

        <!-- Список гиперссылок (из прошлых лабораторных) -->
        <section class="links-section">
            <h2>Список гиперссылок</h2>
            <ul>
                <li><a href="https://www.kubsu.ru" target="_blank">КубГУ</a></li>
                <li><a href="https://vk.com" target="_blank">ВКонтакте</a></li>
            </ul>
        </section>

        <!-- Форма -->
        <section class="form-section">
            <h2>Форма обратной связи</h2>
            <form action="#" method="post">
                <label for="name">Имя:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <button type="submit">Отправить</button>
            </form>
        </section>
    </main>

    <!-- Подвал -->
    <footer class="footer">
        <p>&copy; Сергей Синица</p>
    </footer>

</body>
</html>
